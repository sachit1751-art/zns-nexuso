<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto" fill="none">
  <defs>
    <!-- Soft outer glow filter -->
    <filter id="nexus-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feColorMatrix type="matrix" values="
        1 0 0 0 1
        0 1 0 0 0.98
        0 0 1 0 0.95
        0 0 0 0.65 0" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#nexus-glow)">
    <!-- Outer solid cream shape of Nexus -->
    <!-- N -->
    <path fill="#F3F0E6" fill-rule="evenodd" clip-rule="evenodd" d="
      M 240 45
      C 260 45 272 58 266 82
      L 190 270
      C 185 282 175 290 162 290
      C 145 290 135 278 138 260
      L 205 78
      C 208 68 202 62 190 65
      L 132 235
      C 125 255 110 270 92 270
      C 75 270 65 255 68 238
      L 125 65
      C 132 45 152 42 168 45
      C 185 48 198 62 205 78
      L 225 52
      C 230 48 235 45 240 45
      Z
    " />
  </g>
</svg>