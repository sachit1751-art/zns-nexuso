<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- Soft Glow -->
    <filter id="logo-glow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for 3D depth -->
    <filter id="n-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4338ca" flood-opacity="0.32" />
    </filter>

    <!-- Fold Crease Shadow -->
    <linearGradient id="crease-shadow" x1="60" y1="80" x2="110" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </linearGradient>

    <!-- Left Leg Gradient: Vibrant Electric Blue to Azure -->
    <linearGradient id="left-leg-grad" x1="56" y1="200" x2="96" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="25%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Ribbon Fold Gradient: Continuous Flow from Blue -> Indigo -> Violet -> Purple -->
    <linearGradient id="ribbon-flow-grad" x1="60" y1="60" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="25%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="75%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Right Leg Gradient: Purple to Bright Orchid -->
    <linearGradient id="right-leg-grad" x1="164" y1="190" x2="196" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="85%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow effect matching the uploaded logo -->
  <g opacity="0.45" filter="url(#logo-glow)">
    <circle cx="85" cy="115" r="45" fill="#3b82f6" />
    <circle cx="170" cy="135" r="45" fill="#8b5cf6" />
    <circle cx="128" cy="128" r="40" fill="#6366f1" />
  </g>

  <!-- Main 'N' Ribbon Structure -->
  <g filter="url(#n-shadow)">
    <!-- 1. Left Vertical Stem (Lower Part with Round Base) -->
    <path
      d="M 58 120 L 58 178 C 58 193.5 70.5 206 86 206 C 101.5 206 114 193.5 114 178 L 114 120 Z"
      fill="url(#left-leg-grad)"
    />

    <!-- 2. Fold Crease Shadow under top-left turn -->
    <path
      d="M 58 85 L 114 135 L 114 150 L 58 110 Z"
      fill="url(#crease-shadow)"
    />

    <!-- 3. Continuous Diagonal Ribbon Fold (From Top-Left curve through to Right Stem) -->
    <!-- Outer curve path at top-left: sweeps down diagonally, then loops at bottom right into right stem -->
    <path
      d="
        M 58 120
        L 58 84
        C 58 64 74 48 94 48
        C 107 48 118 55 125 65
        L 182 155
        L 182 84
        C 182 68.5 194.5 56 210 56
        C 225.5 56 238 68.5 238 84
        L 238 178
        C 238 198 222 214 202 214
        C 189 214 178 207 171 197
        L 114 107
        L 114 120
        Z
      "
      display="none"
    />

    <!-- Precise 3-stroke overlapping geometric Ribbon -->
    <!-- Left Stem Top Cap & Body -->
    <path
      d="M 58 176 L 58 84 C 58 68.536 70.536 56 86 56 C 101.464 56 114 68.536 114 84 L 114 176 C 114 191.464 101.464 204 86 204 C 70.536 204 58 191.464 58 176 Z"
      fill="url(#left-leg-grad)"
    />

    <!-- Right Stem -->
    <path
      d="M 142 176 L 142 84 C 142 68.536 154.536 56 170 56 C 185.464 56 198 68.536 198 84 L 198 176 C 198 191.464 185.464 204 170 204 C 154.536 204 142 191.464 142 176 Z"
      fill="url(#right-leg-grad)"
    />

    <!-- Diagonal Overlapping Ribbon Bridge -->
    <path
      d="
        M 62 82
        C 62 67 74 55 89 55
        C 100 55 110 61 116 70
        L 188 174
        C 193 181 195 190 191 198
        C 186 206 176 209 167 207
        C 157 204 150 197 144 188
        L 72 84
        C 66 76 62 78 62 82
        Z
      "
      fill="url(#ribbon-flow-grad)"
    />

    <!-- Soft 3D shadow on diagonal cross -->
    <path
      d="M 88 56 C 96 56 104 60 110 68 L 138 112 C 126 104 108 94 92 88 Z"
      fill="url(#crease-shadow)"
    />
  </g>
</svg>
