<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- Background Gradient for Squircle -->
    <linearGradient id="fav-bg-grad" x1="128" y1="0" x2="128" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f5f8ff" />
      <stop offset="100%" stop-color="#eaf0ff" />
    </linearGradient>

    <!-- Subtle Container Border Gradient -->
    <linearGradient id="fav-border-grad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#bfdbfe" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.7" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Icon Depth -->
    <filter id="fav-shadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4f46e5" flood-opacity="0.25" />
    </filter>

    <!-- Left Leg Gradient: Vibrant Royal & Electric Blue -->
    <linearGradient id="fav-left-grad" x1="60" y1="190" x2="100" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="30%" stop-color="#2563eb" />
      <stop offset="75%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Diagonal Ribbon Fold Gradient -->
    <linearGradient id="fav-ribbon-grad" x1="65" y1="65" x2="195" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="30%" stop-color="#3b82f6" />
      <stop offset="55%" stop-color="#6366f1" />
      <stop offset="80%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Right Leg Gradient: Rich Purple to Violet -->
    <linearGradient id="fav-right-grad" x1="160" y1="190" x2="195" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="80%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Overlap Crease Shadow -->
    <linearGradient id="fav-crease" x1="60" y1="80" x2="110" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect
    x="6"
    y="6"
    width="244"
    height="244"
    rx="54"
    fill="url(#fav-bg-grad)"
    stroke="url(#fav-border-grad)"
    stroke-width="2.5"
  />

  <!-- Subtle ambient inner glow -->
  <g opacity="0.35" filter="url(#fav-glow)">
    <circle cx="95" cy="115" r="40" fill="#3b82f6" />
    <circle cx="165" cy="140" r="40" fill="#8b5cf6" />
  </g>

  <!-- Centered Ribbon 'N' Logo -->
  <g filter="url(#fav-shadow)">
    <!-- Left Vertical Stem -->
    <path
      d="M 64 172 L 64 84 C 64 70.745 74.745 60 88 60 C 101.255 60 112 70.745 112 84 L 112 172 C 112 185.255 101.255 196 88 196 C 74.745 196 64 185.255 64 172 Z"
      fill="url(#fav-left-grad)"
    />

    <!-- Right Vertical Stem -->
    <path
      d="M 144 172 L 144 84 C 144 70.745 154.745 60 168 60 C 181.255 60 192 70.745 192 84 L 192 172 C 192 185.255 181.255 196 168 196 C 154.745 196 144 185.255 144 172 Z"
      fill="url(#fav-right-grad)"
    />

    <!-- Diagonal Overlapping Ribbon Bridge -->
    <path
      d="
        M 68 82
        C 68 69 78 59 91 59
        C 101 59 110 65 115 73
        L 182 170
        C 187 177 188 185 184 192
        C 179 199 170 201 162 199
        C 153 196 147 190 142 182
        L 77 84
        C 72 77 68 78 68 82
        Z
      "
      fill="url(#fav-ribbon-grad)"
    />

    <!-- 3D Shadow under the Fold -->
    <path
      d="M 90 60 C 97 60 104 64 109 71 L 134 110 C 123 103 107 94 93 90 Z"
      fill="url(#fav-crease)"
    />
  </g>
</svg>
